name: Publish Universal QA Reporter to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from reporting/package.json (for example, 0.1.2)
        required: true
        type: string
      confirm_publish:
        description: Publish the validated public package to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - name: Check out the selected release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Verify public package metadata and release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = require("./reporting/package.json");
          const requested = process.env.RELEASE_VERSION;
          if (manifest.name !== "universal-qa-reporter") {
            throw new Error(`Expected public package universal-qa-reporter, but found ${manifest.name}.`);
          }
          if (manifest.version !== requested) {
            throw new Error(`Requested ${requested}, but reporting/package.json contains ${manifest.version}.`);
          }
          if (manifest.publishConfig?.registry !== "https://registry.npmjs.org" || manifest.publishConfig?.access !== "public") {
            throw new Error("Public npm registry metadata is not configured.");
          }
          if (manifest.license !== "MIT") {
            throw new Error("Public publication requires the approved MIT license.");
          }
          if (!fs.existsSync("./reporting/LICENSE")) {
            throw new Error("Public publication requires reporting/LICENSE.");
          }
          const license = fs.readFileSync("./reporting/LICENSE", "utf8");
          if (!license.includes("MIT License") || !license.includes("Copyright (c) 2026 ydvgaurav1")) {
            throw new Error("reporting/LICENSE does not contain the approved MIT license text.");
          }
          NODE
          git tag --points-at HEAD | grep -Fx "universal-qa-reporter-npm-v${RELEASE_VERSION}"

      - name: Install repository dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate types and reporting behavior
        run: |
          npm run typecheck
          npm run test:reporting
          npm run test:universal
          npm run test:adapter
          npm run test:junit
          npm run test:dashboard-evidence
          npm run test:package

      - name: Build package
        run: npm run build:reporter

      - name: Inspect publish contents
        run: npm pack ./reporting --dry-run --json

      - name: Publish public package with provenance
        run: npm publish ./reporting --registry=https://registry.npmjs.org --access=public --provenance
